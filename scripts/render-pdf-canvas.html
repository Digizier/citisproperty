<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Render Master Plan PDF</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body style="margin: 0; background: #000;">
  <canvas id="pdfCanvas"></canvas>
  <div id="status" style="color: white; font-family: sans-serif; padding: 10px;">Initializing...</div>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    async function renderPdf(base64Data) {
      try {
        document.getElementById('status').innerText = 'Decoding PDF data...';
        const raw = atob(base64Data);
        const uint8Array = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; i++) {
          uint8Array[i] = raw.charCodeAt(i);
        }

        document.getElementById('status').innerText = 'Loading PDF document...';
        const loadingTask = pdfjsLib.getDocument({ data: uint8Array });
        const pdf = await loadingTask.promise;
        document.getElementById('status').innerText = 'Pages: ' + pdf.numPages + ', rendering page 1...';

        const page = await pdf.getPage(1);
        const baseViewport = page.getViewport({ scale: 1.0 });
        console.log('Base Viewport:', baseViewport.width, baseViewport.height);

        // Target high-res width around 2400px
        const scale = 2400 / baseViewport.width;
        const viewport = page.getViewport({ scale: scale });

        const canvas = document.getElementById('pdfCanvas');
        const context = canvas.getContext('2d');
        canvas.width = viewport.width;
        canvas.height = viewport.height;

        const renderContext = {
          canvasContext: context,
          viewport: viewport
        };

        await page.render(renderContext).promise;
        document.getElementById('status').innerText = 'RENDER_COMPLETE';
        window.renderSuccess = true;
      } catch (err) {
        console.error(err);
        document.getElementById('status').innerText = 'ERROR: ' + err.message;
        window.renderError = err.message;
      }
    }
  </script>
</body>
</html>
